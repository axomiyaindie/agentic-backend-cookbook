name: Check Python

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '.github/workflows/check-python.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Byte-compile every .py file
        run: |
          set -e
          find . -name "*.py" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 python -m py_compile
          echo "All .py files compiled successfully."