name: Check TypeScript

on:
  push:
    branches: [main]
    paths:
      - '**/*.ts'
      - '.github/workflows/check-typescript.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.ts'

jobs:
  typecheck:
    name: Type-check ${{ matrix.lesson }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lesson:
          - 01-api-design/01-http-typescript
          - 01-api-design/02-crud-model
          - 02-mcp-connectors/01-minimal-mcp-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (if package.json exists)
        working-directory: ${{ matrix.lesson }}
        run: |
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
          fi

      - name: Type-check
        working-directory: ${{ matrix.lesson }}
        run: |
          set -e
          if [ -f node_modules/.bin/tsc ]; then
            # The lesson has its own TypeScript (from package.json).
            ./node_modules/.bin/tsc --noEmit --strict \
              --target ES2022 --module ESNext --moduleResolution bundler *.ts
          else
            # No package.json. Use a pinned TypeScript via npx.
            # `-p typescript@5.6.3` tells npx which package to install;
            # `tsc` after it is the executable to run from that package.
            npx --yes -p typescript@5.6.3 tsc --noEmit --strict \
              --target ES2022 --module ESNext --moduleResolution bundler *.ts
          fi
          echo "Type-check passed for ${{ matrix.lesson }}"