<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Agentic Backend Cookbook</title>
  <desc id="desc">Banner for the Agentic Backend Cookbook: runnable backend lessons for AI applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1f"/>
      <stop offset="1" stop-color="#1b1146"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2"/>

  <!-- icon: node graph inside rounded square -->
  <g transform="translate(558 34)">
    <rect width="84" height="84" rx="20" fill="#0a0e1f" stroke="url(#accent)" stroke-width="3"/>
    <g stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round">
      <line x1="42" y1="42" x2="22" y2="24"/>
      <line x1="42" y1="42" x2="62" y2="24"/>
      <line x1="42" y1="42" x2="42" y2="66"/>
      <line x1="22" y1="24" x2="62" y2="24" stroke-opacity="0.4"/>
    </g>
    <circle cx="42" cy="42" r="8" fill="url(#accent)"/>
    <circle cx="22" cy="24" r="5" fill="#22d3ee"/>
    <circle cx="62" cy="24" r="5" fill="#a78bfa"/>
    <circle cx="42" cy="66" r="5" fill="#67e8f9"/>
  </g>

  <!-- title -->
  <text x="600" y="184" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-1" fill="url(#titleFill)">Agentic Backend Cookbook</text>

  <!-- tagline -->
  <text x="600" y="220" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="18" fill="#a5b4fc">read it. run it. break it. understand it.</text>

  <!-- topic chips -->
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#e0e7ff" text-anchor="middle">
    <rect x="352" y="244" width="120" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="412" y="263">API design</text>
    <rect x="484" y="244" width="120" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="544" y="263">MCP servers</text>
    <rect x="616" y="244" width="120" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="676" y="263">RBAC</text>
    <rect x="748" y="244" width="120" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="808" y="263">Databases</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
